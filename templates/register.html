{% extends "base.html" %}

{% block content %}
<div class="container" style="padding: 40px 0;">
  <div class="form-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <h2 style="font-size: 2rem; font-weight: 800;">Create Account</h2>
      <p style="color: var(--text-muted);">Join PocketSmart AI to create and save personalized budget blueprints.</p>
    </div>

    <form action="/register" method="POST">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="Aarav Sharma" value="{{ name | default('') }}" required autofocus>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="aarav@example.com" value="{{ email | default('') }}" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Min. 6 chars" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat password" required minlength="6">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
        Register Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.95rem; color: var(--text-muted);">
      Already have an account? <a href="/login" style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
